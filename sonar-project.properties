sonar.projectKey=bbh2004_NagrikSevaSetu
sonar.organization=bbh2004

# Directories to scan for source code
sonar.sources=civicBackend/src, civicWeb/src, civicApp/lib

# Directories containing test files
sonar.tests=civicBackend/tests, civicWeb/tests, civicApp/test

# Exclude dependencies and build artifacts from analysis
sonar.exclusions=**/node_modules/**, civicApp/build/**, civicApp/.dart_tool/**, civicApp/ios/**, civicApp/android/**, civicApp/web/**, civicApp/macos/**, civicApp/windows/**, civicApp/linux/**

# Coverage reporting paths (if you eventually add coverage flags to your test scripts)
sonar.javascript.lcov.reportPaths=civicBackend/coverage/lcov.info, civicWeb/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=civicApp/coverage/lcov.info
